name: Tests

# `pr-title.yml` runs the gate. Nothing ran the gate's own tests, so a change to
# the regex in `check-pr-title.sh` could reach the default branch — and from
# there every repository created from this template — without anything noticing.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-tests:
    name: Shell tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Run the PR-title gate's tests
        run: sh scripts/check-pr-title.test.sh

      # The runner's /bin/sh is dash, whose ${#var} counts bytes rather than
      # characters. The suite pins that case itself, but running the whole
      # thing under a non-UTF-8 locale catches any future assertion that
      # silently depends on the ambient one.
      - name: Run them again with a byte-counting locale
        run: LC_ALL=C sh scripts/check-pr-title.test.sh

  workspace-tests:
    name: Workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Matches docker/compose.yml's postgres service: same image, same
    # user/password/database. The service's internal port is always 5432;
    # DATABASE_URL below uses that directly rather than the 5433 host remap
    # docker/compose.yml uses for local dev, which exists only to avoid
    # colliding with a developer's own Postgres on 5432.
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_USER: todoer
          POSTGRES_PASSWORD: todoer
          POSTGRES_DB: todoer
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://todoer:todoer@localhost:5432/todoer
      JWT_SECRET: ci-only-secret-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        working-directory: apps/backend
        run: pnpm prisma migrate deploy

      # build first: @todoer/backend now depends on @todoer/specs's dist/,
      # which only exists after @todoer/specs's own build script runs.
      # turbo's dependsOn: ["^build"] on typecheck/test would pull that in
      # on its own, but listing build explicitly here makes the ordering an
      # assertion this job makes rather than an implementation detail of
      # another package's turbo.json.
      - name: Build, typecheck, and test the workspace
        run: pnpm -w exec turbo run build typecheck test
