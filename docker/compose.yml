name: todoer-dev

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_USER: todoer
      POSTGRES_PASSWORD: todoer
      POSTGRES_DB: todoer
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todoer"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
