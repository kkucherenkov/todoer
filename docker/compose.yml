name: todoer-dev

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_USER: todoer
      # The default is for development. On the NAS set it (README): Postgres
      # reads it once, when it first initialises the volume.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todoer}
      POSTGRES_DB: todoer
    # Loopback only: the developer's tools reach it, the network does not.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todoer"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The NAS service. Behind a profile so the developer's plain `up -d` still
  # starts only Postgres: `docker compose -f docker/compose.yml --profile app up -d`.
  app:
    profiles: [app]
    build:
      context: ..
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://todoer:${POSTGRES_PASSWORD:-todoer}@postgres:5432/todoer
      # Not `:?`: compose interpolates every service, so a required variable
      # would break the developer's plain `up -d`. The app refuses to start
      # without it (AppConfig).
      JWT_SECRET: ${JWT_SECRET:-}
      # Hops between the NAS proxy and the app, or its address (README).
      TRUST_PROXY: ${TRUST_PROXY:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pgdata:
